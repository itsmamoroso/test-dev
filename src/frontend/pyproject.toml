[project]
name = "study-tracker-frontend"
version = "0.0.0"
description = "Frontend for DevOps Study Tracker application"
readme = "README.md"
authors = [{ name = "thor", email = "midgar@thor.com" }]
requires-python = ">=3.13"
dependencies = [
    "datetime>=6.0",
    "flask>=3.1.3",
    "jsonify>=0.5",
    "render-template>=0.2.0",
    "requests>=2.34.2",
]

[project.scripts]
study-tracker-frontend = "frontend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.4",
]
