[project]
name = "study-tracker-backend"
version = "0.0.0"
description = "Backend API for tracking study time"
readme = "README.md"
authors = [
    { name = "thor", email = "midgar@thor.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ruff>=0.17.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
study-tracker-backend = "backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
