[project]
name = "study-tracker-backend"
version = "0.2.0"
description = "Backend API for tracking study time"
readme = "README.md"
authors = [
    { name = "thor", email = "midgar@thor.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
study-tracker-backend = "backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
